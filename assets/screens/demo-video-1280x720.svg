<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="videoTitle videoDesc">
  <title id="videoTitle">Faultline demo video placeholder</title>
  <desc id="videoDesc">A wide placeholder card for a future Faultline walkthrough video.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1b2d"/>
      <stop offset="1" stop-color="#091220"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>
  <rect width="1280" height="720" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="720" rx="24" fill="url(#dots)"/>
  <rect x="0.75" y="0.75" width="1278.5" height="718.5" rx="23.25" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>

  <path d="M948 0 1002 92 974 160 1056 264 1022 352 1104 470 1078 720" fill="none" stroke="#e0592a" stroke-opacity="0.08" stroke-width="22"/>
  <path d="M948 0 1002 92 974 160 1056 264 1022 352 1104 470 1078 720" fill="none" stroke="#e0592a" stroke-opacity="0.34" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="640" cy="330" r="72" fill="#e0592a" opacity="0.18" filter="url(#glow)"/>
  <circle cx="640" cy="330" r="66" fill="#e0592a" fill-opacity="0.14" stroke="#e0592a" stroke-opacity="0.6" stroke-width="2"/>
  <path d="M624 300 676 330 624 360z" fill="#f5f6f8"/>

  <text x="640" y="462" text-anchor="middle" fill="#f5f6f8" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="-0.8">Demo video placeholder</text>
  <text x="640" y="500" text-anchor="middle" fill="#a8b7c9" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="18">Record a short walkthrough and replace this card before release</text>

  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.8">
    <rect x="500" y="538" width="126" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="563" y="560" text-anchor="middle" fill="#cbd6e3">1280 x 720</text>
    <rect x="640" y="538" width="140" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="710" y="560" text-anchor="middle" fill="#cbd6e3">SHORT CLIP</text>
  </g>

  <text x="64" y="664" fill="#6d7e93" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1.2">FAULTLINE UNIVERSITY PORTAL</text>
</svg>
